     <script>
        window.addEventListener('load', function() {
            const loaderWrapper = document.querySelector('.loader-wrapper');
            const mainContent = document.querySelector('.konten-utama');
            loaderWrapper.classList.add('loader-hidden');
            mainContent.style.display = 'block';
            loaderWrapper.addEventListener('transitionend', function() {
                loaderWrapper.remove();
            });
        });


        document.getElementById('helpDeskForm').addEventListener('submit', function(event) {
        event.preventDefault();

                const nama = document.getElementById('nama').value;
                const email = document.getElementById('email').value;
                const subjek = document.getElementById('subjek').value;
                const masalah = document.getElementById('masalah').value;

                alert('Data Anda telah berhasil disimpan!');

                document.getElementById('helpDeskForm').reset();
        });

        document.getElementById("helpDeskForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const email = document.getElementById("email").value.trim();
        let valid = true;

        document.getElementById("namaError").textContent = "";
        document.getElementById("emailError").textContent = "";

        if (nama === "") {
            document.getElementById("namaError").textContent = "Nama tidak boleh kosong.";
            valid = false;
        }

        if (!validateEmail(email)) {
            document.getElementById("emailError").textContent = "Email tidak valid.";
            valid = false;
        }

        if (valid) {
            document.getElementById("successMessage").style.display = "block";
            setTimeout(() => {
            document.getElementById("successMessage").style.display = "none";
            document.getElementById("helpDeskForm").reset();
            }, 3000);
        }
        });

        function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(String(email).toLowerCase());
        }
    </script>
